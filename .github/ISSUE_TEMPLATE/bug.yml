name: Bug report
description: Report a reproducible defect that is not a private security vulnerability
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach personal save files or disclose a security vulnerability here. Follow SECURITY.md for private reports.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-alpha.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - Steam Deck / Linux (experimental)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use disposable data and remove user names and local paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe diagnostic report
      description: Paste the report copied from Diagnostics after reviewing it.
      render: json
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I used disposable copies or retained an independent backup before testing restore behavior.
          required: true
